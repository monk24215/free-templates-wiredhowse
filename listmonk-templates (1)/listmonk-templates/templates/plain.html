{{ template "email-header" . }}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{ .Campaign.Subject }}</title>
</head>
<body style="margin:0;padding:0;background:#ffffff;font-family:Georgia,serif;">
<table width="100%" cellpadding="0" cellspacing="0" style="background:#ffffff;padding:48px 24px;">
  <tr><td align="center">
    <table width="100%" style="max-width:540px;" cellpadding="0" cellspacing="0">

      <!-- From line -->
      <tr><td style="font-family:Arial,sans-serif;font-size:13px;color:#999999;padding-bottom:32px;">
        From: <strong style="color:#555555;">{{ .Campaign.FromName }}</strong> &lt;{{ .Campaign.FromEmail }}&gt;
      </td></tr>

      <!-- Message -->
      <tr><td style="font-family:Georgia,serif;font-size:16px;line-height:1.9;color:#222222;">
        {{ .Message }}
      </td></tr>

      <!-- Signature gap -->
      <tr><td style="height:40px;"></td></tr>

      <!-- Footer -->
      <tr><td style="font-family:Arial,sans-serif;font-size:12px;color:#bbbbbb;border-top:1px solid #eeeeee;padding-top:20px;">
        <a href="{{ UnsubscribeURL }}" style="color:#bbbbbb;">Unsubscribe</a>
        &nbsp;&middot;&nbsp;
        <a href="{{ ManageSubscriptionURL }}" style="color:#bbbbbb;">Manage preferences</a>
      </td></tr>

    </table>
  </td></tr>
</table>
</body>
</html>
{{ template "email-footer" . }}
