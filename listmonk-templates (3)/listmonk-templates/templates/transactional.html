{{ template "email-header" . }}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{ .Campaign.Subject }}</title>
</head>
<body style="margin:0;padding:0;background:#f0f2f5;font-family:Arial,Helvetica,sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0" style="background:#f0f2f5;padding:40px 16px;">
  <tr><td align="center">
    <table width="100%" style="max-width:520px;" cellpadding="0" cellspacing="0">

      <tr><td style="text-align:center;padding-bottom:24px;">
        <div style="font-size:16px;font-weight:700;color:#111111;">{{ .Campaign.Name }}</div>
      </td></tr>

      <tr><td style="background:#ffffff;border-radius:12px;padding:40px 44px;border:1px solid #e8e8e8;">
        <h2 style="font-size:20px;font-weight:600;color:#111111;margin:0 0 20px;line-height:1.3;">{{ .Campaign.Subject }}</h2>
        <div style="font-size:15px;line-height:1.75;color:#444444;">
          {{ template "content" . }}
        </div>
      </td></tr>

      <tr><td style="padding:24px 0;text-align:center;">
        <p style="font-size:12px;color:#aaaaaa;margin:0;line-height:1.7;font-family:Arial,sans-serif;">
          <a href="{{ UnsubscribeURL }}" style="color:#aaaaaa;text-decoration:none;">Unsubscribe</a>
        </p>
      </td></tr>

    </table>
  </td></tr>
</table>
</body>
</html>
{{ template "email-footer" . }}
