{{ template "email-header" . }}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{ .Campaign.Subject }}</title>
</head>
<body style="margin:0;padding:0;background:#faf9f7;font-family:Georgia,serif;">
<table width="100%" cellpadding="0" cellspacing="0" style="background:#faf9f7;padding:40px 16px;">
  <tr><td align="center">
    <table width="100%" style="max-width:580px;" cellpadding="0" cellspacing="0">

      <tr><td style="padding-bottom:32px;text-align:center;border-bottom:2px solid #1a1a1a;">
        <div style="font-size:11px;font-family:Arial,sans-serif;letter-spacing:0.14em;text-transform:uppercase;color:#888888;margin-bottom:8px;">{{ .Campaign.Name }}</div>
      </td></tr>

      <tr><td style="padding:36px 0 20px;">
        <h1 style="font-size:32px;font-weight:700;color:#1a1a1a;margin:0;line-height:1.2;font-family:Georgia,serif;">{{ .Campaign.Subject }}</h1>
      </td></tr>

      <tr><td style="font-family:Georgia,serif;font-size:17px;line-height:1.85;color:#2c2c2c;">
        {{ template "content" . }}
      </td></tr>

      <tr><td style="padding-top:48px;border-top:1px solid #dddddd;">
        <table width="100%" cellpadding="0" cellspacing="0">
          <tr>
            <td style="font-family:Arial,sans-serif;font-size:12px;color:#aaaaaa;">{{ .Campaign.Name }}</td>
            <td style="text-align:right;font-family:Arial,sans-serif;font-size:12px;">
              <a href="{{ UnsubscribeURL }}" style="color:#aaaaaa;text-decoration:none;">Unsubscribe</a>
            </td>
          </tr>
        </table>
      </td></tr>

    </table>
  </td></tr>
</table>
</body>
</html>
{{ template "email-footer" . }}
