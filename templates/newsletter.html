{{ template "email-header" . }}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{ .Campaign.Subject }}</title>
</head>
<body style="margin:0;padding:0;background:#f4f4f4;font-family:Georgia,serif;">
<table width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f4;padding:32px 16px;">
  <tr><td align="center">
    <table width="100%" style="max-width:600px;background:#ffffff;border-radius:8px;overflow:hidden;" cellpadding="0" cellspacing="0">

      <!-- Header -->
      <tr><td style="background:#1a1a2e;padding:32px;text-align:center;">
        <div style="font-size:28px;font-weight:700;color:#e8c547;font-family:Georgia,serif;letter-spacing:-0.5px;">{{ .Campaign.Name }}</div>
        <div style="font-size:13px;color:rgba(255,255,255,0.55);margin-top:6px;font-family:Arial,sans-serif;letter-spacing:0.08em;text-transform:uppercase;">Weekly newsletter</div>
      </td></tr>

      <!-- Body -->
      <tr><td style="padding:36px 40px;font-family:Georgia,serif;">
        <h2 style="font-size:22px;font-weight:700;color:#1a1a2e;margin:0 0 16px;line-height:1.3;">{{ .Campaign.Subject }}</h2>
        <div style="font-size:16px;line-height:1.8;color:#333333;">
          {{ .Message }}
        </div>
      </td></tr>

      <!-- Divider -->
      <tr><td style="padding:0 40px;">
        <hr style="border:none;border-top:1px solid #e8e8e8;margin:0;" />
      </td></tr>

      <!-- Footer -->
      <tr><td style="padding:24px 40px;text-align:center;font-family:Arial,sans-serif;">
        <p style="font-size:12px;color:#999999;line-height:1.6;margin:0;">
          You're receiving this because you subscribed.<br />
          <a href="{{ UnsubscribeURL }}" style="color:#e8c547;text-decoration:none;">Unsubscribe</a> &nbsp;&middot;&nbsp;
          <a href="{{ ManageSubscriptionURL }}" style="color:#e8c547;text-decoration:none;">Manage preferences</a>
        </p>
      </td></tr>

    </table>
  </td></tr>
</table>
</body>
</html>
{{ template "email-footer" . }}
